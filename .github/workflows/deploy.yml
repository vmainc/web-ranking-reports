# Build web image → GHCR, then optionally deploy to VPS.
#
# If build-image fails in ~30s (not minutes), open that job’s log — usually GHCR permissions.
# Org fix: GitHub → vmainc → Settings → Actions → General → “Read and write permissions”.
#
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, GHCR_READ_TOKEN (VPS pull)
# Optional: GHCR_WRITE_TOKEN — not used in workflow (GITHUB_TOKEN pushes). If push is denied,
# enable org Actions “Read and write permissions” or contact admin.
# Variables: DEPLOY_PATH, GHCR_USERNAME (personal GitHub username for docker login on VPS)

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Single-segment package name (avoids GHCR path issues)
  WEB_IMAGE_NAME: ghcr.io/vmainc/web-ranking-reports-web

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          provenance: false
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:main
            ${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_POCKETBASE_URL=https://pb.webrankingreports.com
            APP_URL=https://webrankingreports.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip SSH deploy when VPS secrets are not configured (image is still published).
    if: ${{ needs.build-image.result == 'success' && vars.DEPLOY_PATH != '' }}
    steps:
      - name: SSH deploy — pull image + restart web
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || 22 }}
          envs: GHCR_READ_TOKEN,GHCR_USERNAME
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_PATH='${{ vars.DEPLOY_PATH }}'
            WEB_IMAGE='${{ env.WEB_IMAGE_NAME }}'
            WEB_IMAGE_TAG='${{ github.sha }}'
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd --exclude=.env --exclude=infra/.env
            echo "Deployed commit: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"
            [ -f .env ] || touch .env
            REPO="$DEPLOY_PATH"
            COMPOSE="docker compose --project-directory $REPO/infra --env-file $REPO/infra/.env -f $REPO/infra/docker-compose.yml"
            if [ -n "${GHCR_READ_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            export WEB_IMAGE WEB_IMAGE_TAG USE_PREBUILT_WEB_IMAGE=true
            echo "Pulling $WEB_IMAGE:$WEB_IMAGE_TAG ..."
            $COMPOSE pull web
            echo "Restarting web (no build) ..."
            $COMPOSE up -d --no-build --force-recreate web
            echo "Done."
