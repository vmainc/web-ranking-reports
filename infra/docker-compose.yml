# Web Ranking Reports — MVP stack
# From repo root (recommended — use absolute paths + project dir so env_file paths always resolve):
#   docker compose --project-directory "$PWD/infra" --env-file "$PWD/infra/.env" -f "$PWD/infra/docker-compose.yml" up -d
# Put secrets in infra/.env (SMTP_USER, SMTP_PASSWORD, PB_*, STATE_SIGNING_SECRET, …).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - WEBRANKINGREPORTS_DOMAIN=${WEBRANKINGREPORTS_DOMAIN:-webrankingreports.com}
      - POCKETBASE_SUBDOMAIN=${POCKETBASE_SUBDOMAIN:-pb}
    depends_on:
      - web
      - pb

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        - NUXT_PUBLIC_POCKETBASE_URL=${NUXT_PUBLIC_POCKETBASE_URL:-https://pb.webrankingreports.com}
        - APP_URL=${APP_URL:-https://webrankingreports.com}
    # Prebuilt images from GitHub Actions (fast deploy). Override WEB_IMAGE / WEB_IMAGE_TAG in infra/.env.
    image: ${WEB_IMAGE:-ghcr.io/vmainc/web-ranking-reports-web}:${WEB_IMAGE_TAG:-main}
    restart: unless-stopped
    # Paths are relative to this file’s directory (infra/). Order: repo .env then infra/.env — same key → later wins.
    # Do not list SMTP_* (or duplicate PB_*/STATE_* below): empty `environment:` values override env_file per Compose spec.
    env_file:
      - ../.env
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      - NUXT_PUBLIC_POCKETBASE_URL=${NUXT_PUBLIC_POCKETBASE_URL:-https://pb.webrankingreports.com}
      - APP_URL=${APP_URL:-https://webrankingreports.com}
      - NUXT_PUBLIC_APP_URL=${APP_URL:-https://webrankingreports.com}
      - PB_URL=${PB_URL:-http://pb:8090}
      # PB_*, ADMIN_EMAILS, STATE_SIGNING_SECRET: from env_file only (see header — avoid empty ${VAR} overriding the file).
      # Nuxt runtimeConfig in production only reads NUXT_* prefixed vars
      - NUXT_PB_URL=${PB_URL:-http://pb:8090}
      - NUXT_PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - NUXT_PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - NUXT_ADMIN_EMAILS=${ADMIN_EMAILS}
      - NUXT_STATE_SIGNING_SECRET=${STATE_SIGNING_SECRET}
      - INVITE_PASSWORD_TOKEN_SECRET=${INVITE_PASSWORD_TOKEN_SECRET:-}
      - NUXT_INVITE_PASSWORD_TOKEN_SECRET=${INVITE_PASSWORD_TOKEN_SECRET:-}
      # SMTP_*, PAGESPEED_API_KEY, NUXT_PUBLIC_WOOCOMMERCE_ENABLED, GOOGLE_CLIENT_*,
      # GOOGLE_OAUTH_REDIRECT_URI, EMAIL_CREDENTIALS_ENCRYPTION_KEY: set in env_file (infra/.env),
      # not here — empty ${VAR:-} here would override env_file and break mail / Gmail OAuth.
      # Weekly automated rank refresh (Friday 00:00 in RANK_TRACKING_CRON_TZ)
      - RANK_TRACKING_WEEKLY_CRON_ENABLED=${RANK_TRACKING_WEEKLY_CRON_ENABLED:-true}
      - RANK_TRACKING_CRON_TZ=${RANK_TRACKING_CRON_TZ:-America/Chicago}
      - RANK_TRACKING_CRON_EXPRESSION=${RANK_TRACKING_CRON_EXPRESSION:-0 0 * * 5}
      # Weekly Lighthouse / PageSpeed for all sites (Friday 00:00 in LIGHTHOUSE_CRON_TZ)
      - LIGHTHOUSE_WEEKLY_CRON_ENABLED=${LIGHTHOUSE_WEEKLY_CRON_ENABLED:-true}
      - LIGHTHOUSE_CRON_TZ=${LIGHTHOUSE_CRON_TZ:-America/Chicago}
      - LIGHTHOUSE_CRON_EXPRESSION=${LIGHTHOUSE_CRON_EXPRESSION:-0 0 * * 5}
      - LIGHTHOUSE_WEEKLY_STRATEGIES=${LIGHTHOUSE_WEEKLY_STRATEGIES:-mobile,desktop}
      # Weekly DataForSEO backlink profiles for all sites (Friday 00:00 in BACKLINKS_CRON_TZ)
      - BACKLINKS_WEEKLY_CRON_ENABLED=${BACKLINKS_WEEKLY_CRON_ENABLED:-true}
      - BACKLINKS_CRON_TZ=${BACKLINKS_CRON_TZ:-America/Chicago}
      - BACKLINKS_CRON_EXPRESSION=${BACKLINKS_CRON_EXPRESSION:-0 0 * * 5}
      # One-time all-sites fetch after deploy (skipped once bootstrapCompletedAt is stored)
      - BACKLINKS_BOOTSTRAP_ON_START=${BACKLINKS_BOOTSTRAP_ON_START:-true}
      - BACKLINKS_BOOTSTRAP_DELAY_MS=${BACKLINKS_BOOTSTRAP_DELAY_MS:-60000}
      - BACKLINKS_SITE_DELAY_MS=${BACKLINKS_SITE_DELAY_MS:-3000}
      # Automated report schedules (~every 7 min UTC; set REPORT_SCHEDULES_CRON_ENABLED=false to disable)
      - REPORT_SCHEDULES_CRON_ENABLED=${REPORT_SCHEDULES_CRON_ENABLED:-true}
      - REPORT_SCHEDULES_CRON_TZ=${REPORT_SCHEDULES_CRON_TZ:-UTC}
      - REPORT_SCHEDULES_CRON_EXPRESSION=${REPORT_SCHEDULES_CRON_EXPRESSION:-*/7 * * * *}
      # Email campaigns batch sender (~every 3 min UTC; set EMAIL_CAMPAIGNS_CRON_ENABLED=false to disable)
      - EMAIL_CAMPAIGNS_CRON_ENABLED=${EMAIL_CAMPAIGNS_CRON_ENABLED:-true}
      - EMAIL_CAMPAIGNS_CRON_TZ=${EMAIL_CAMPAIGNS_CRON_TZ:-UTC}
      - EMAIL_CAMPAIGNS_CRON_EXPRESSION=${EMAIL_CAMPAIGNS_CRON_EXPRESSION:-*/3 * * * *}
      - EMAIL_CAMPAIGNS_BATCH_SIZE=${EMAIL_CAMPAIGNS_BATCH_SIZE:-25}
    expose:
      - "3000"
    # Production: web is only reachable via Caddy on the Docker network.
    # For host debugging, copy docker-compose.override.example.yml → docker-compose.override.yml

  pb:
    build:
      context: .
      dockerfile: Dockerfile.pb
    restart: unless-stopped
    volumes:
      - pb_data:/pb_data
      # Repo JS migrations (e.g. users.default_google_json) — without this, --dir=/pb_data never sees them.
      - ../apps/pb/pb_migrations:/pb_data/pb_migrations:ro
      # Safety mode for existing production DBs: run with empty migrations dir to avoid replaying historical creates.
      - ../apps/pb/pb_migrations_empty:/pb_data/pb_migrations_empty:ro
    environment:
      - POCKETBASE_DEBUG=0
    expose:
      - "8090"

volumes:
  caddy_data:
  caddy_config:
  pb_data:
